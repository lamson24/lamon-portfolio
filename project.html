<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail | LAMON-DIY</title>
    <meta name="description" content="Project detail page">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="project-page">
    <!-- Page Transition Overlay -->
    <div id="page-transition" class="page-transition"></div>

    <!-- Custom Cursor -->
    <div id="custom-cursor" class="custom-cursor"></div>
    <div id="custom-cursor-follower" class="custom-cursor-follower"></div>
    <canvas id="ai-canvas"></canvas>
    <a href="index.html#projects" class="project-back-icon" id="project-back">&#8592;</a>
    <div class="project-right-controls">
        <a href="https://zalo.me/0123456789" target="_blank" class="project-zalo-btn" id="project-zalo">Zalo</a>
        <div class="project-lang-switch" id="lang-switch">
            <button type="button" class="lang-btn" data-lang="en">EN</button>
            <button type="button" class="lang-btn" data-lang="vi">VI</button>
        </div>
    </div>

    <main class="project-main container">
        <section class="project-hero">
            <p class="project-kicker" id="project-category"></p>
            <h1 class="project-title-detail" id="project-title"></h1>
            <p class="project-subtitle-detail" id="project-subtitle"></p>
            <p class="project-location" id="project-location"></p>
        </section>

        <section class="project-gallery-grid" id="project-gallery-grid"></section>

        <section class="project-description-card">
            <h2 id="project-about-heading">Project Overview</h2>
            <p id="project-description"></p>
        </section>

        <section class="project-case-study" id="project-case-study" aria-label="Case study"></section>
    </main>

    <!-- Lightbox Gallery -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close" id="lightbox-close">&times;</span>
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous image">&lt;</button>
        <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next image">&gt;</button>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Gallery Image">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
        <!-- Invisible SVG Filter for Liquid Effect -->
    <svg style="width: 0; height: 0; position: absolute; visibility: hidden;" aria-hidden="true">
        <filter id="liquid" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0" numOctaves="3" result="noise"></feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="B"></feDisplacementMap>
        </filter>
    </svg>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>
    <script src="upgrade.js"></script>
    <script src="canvas.js"></script>
    <script src="project.js?v=3.1"></script>
</body>

</html>
